name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Schedule boundary tests
        run: dotnet run --project tests/ScheduleTests/ScheduleTests.csproj --configuration Release
      - name: Restore and build WPF application
        run: msbuild ZongziTEK.BlackboardSticker.sln /restore /p:Configuration=Release /p:Platform="Any CPU"
      - uses: actions/upload-artifact@v4
        with:
          name: Blackboard-Sticker-Windows
          path: ZongziTEK.BlackboardSticker/bin/Release/net472/
          if-no-files-found: error
